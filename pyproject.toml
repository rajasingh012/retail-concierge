[project]
name = "retail-concierge"
version = "0.1.0"
description = "Collaborative retail recommendation agents on AMD ROCm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "rajasingh012" },
]
keywords = ["multi-agent", "retail", "amd", "rocm", "vllm", "microsoft-agent-framework"]

dependencies = [
    "agent-framework-core>=1.10.0",
    "agent-framework-openai>=1.10.0",
]

[project.urls]
Repository = "https://github.com/rajasingh012/retail-concierge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain", "use_cases", "infrastructure"]
